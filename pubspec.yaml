name: otel_flutter_riverpod
description: >-
  OpenTelemetry instrumentation for flutter_riverpod by Dartastic.io. Adds
  standard OpenTelemetry observability to applications that use
  flutter_riverpod.
version: 0.3.1-wip
repository: https://github.com/dartastic/otel_flutter_riverpod
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  dartastic_opentelemetry_api: '>=1.0.0-rc.4 <1.0.0-rc.5'
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  otel_riverpod: ^0.3.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  dartastic_opentelemetry: ^1.1.0-beta.17
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
